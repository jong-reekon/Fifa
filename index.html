<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA League</title>
<style>
  :root {
    --bg: #f4f1f7; --card: #fff; --ink: #1d1029; --muted: #6b6276; --line: #e6e0ec;
    --brand: #37003c; --accent: #00ff85; --win: #13a35a; --draw: #9a9aa3; --loss: #e0245e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #140a18; --card: #1f1325; --ink: #f3eef6; --muted: #a59bb0; --line: #34263b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--brand); color: #fff; padding: 20px 16px; }
  header .inner { margin: 0 auto; max-width: 960px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  header h1::before { content: ""; width: 12px; height: 24px; background: var(--accent); border-radius: 2px; }
  #status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.15); }
  #status.live::before { content: "● "; color: var(--accent); }
  #status.local::before { content: "● "; color: #ffb020; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  td.name, th.name { text-align: left; }
  td.name { font-weight: 600; }
  td.pts { font-weight: 800; }
  tr.leader td:first-child { box-shadow: inset 4px 0 var(--accent); }
  .form { display: inline-flex; gap: 3px; }
  .form span { width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .W { background: var(--win); } .D { background: var(--draw); } .L { background: var(--loss); }
  .week { margin-bottom: 16px; }
  .week h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .fixture { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .fixture .home { text-align: right; font-weight: 600; }
  .fixture .away { font-weight: 600; }
  .score { display: flex; align-items: center; gap: 4px; }
  .score input { width: 44px; padding: 6px; text-align: center; font: inherit; font-weight: 700; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .score input:focus { outline: 2px solid var(--brand); }
  .played .score input { background: var(--brand); color: #fff; border-color: var(--brand); }
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .players input { width: 100%; padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  button.danger { color: var(--loss); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  @media (min-width: 800px) { main { grid-template-columns: 1fr 1fr; } .full { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header><div class="inner"><h1>FIFA League</h1><span id="status">Connecting…</span></div></header>
<main>
  <section class="card full">
    <h2>Table</h2>
    <div class="scroll"><table id="table"></table></div>
  </section>

  <section class="card">
    <h2>Fixtures &amp; Results</h2>
    <div id="fixtures"></div>
  </section>

  <section class="card">
    <h2>Players</h2>
    <div class="players" id="players"></div>
    <div class="row">
      <button class="primary" id="saveNames">Save names</button>
      <button class="danger" id="reset">Reset results</button>
    </div>
    <p class="hint">Changes save automatically and show up live for everyone viewing the site. Renaming keeps the results.</p>
  </section>
</main>

<script type="module">
// Paste your Firebase web app config here (Firebase console → Project settings → Your apps).
// These values are not secret; access is controlled by the database rules in database.rules.json.
const firebaseConfig = {
    apiKey: "AIzaSyCxonEpoLbyrGQs3OpSNRsIfp5IznUBSAM",
    authDomain: "fifa-333bc.firebaseapp.com",
    databaseURL: "https://fifa-333bc-default-rtdb.firebaseio.com",
    projectId: "fifa-333bc",
    storageBucket: "fifa-333bc.firebasestorage.app",
    messagingSenderId: "1050724959608",
    appId: "1:1050724959608:web:fbbd17acce5b3df534b48d"
  };

const PLAYER_COUNT = 6;
const DEFAULT_PLAYERS = ["Player 1", "Player 2", "Player 3", "Player 4", "Player 5", "Player 6"];
const LOCAL_KEY = "fifa-league-v1";

let state = { players: [...DEFAULT_PLAYERS], results: {} }; // results: "h-a" (player indexes) -> [homeGoals, awayGoals]
const drafts = {}; // half-entered scores, kept locally until both boxes are filled

// Round-robin schedule (circle method): every player meets every other once.
function schedule(n) {
  const ids = [...Array(n).keys()];
  const weeks = [];
  for (let r = 0; r < n - 1; r++) {
    const games = [];
    for (let k = 0; k < n / 2; k++) {
      const a = ids[k], b = ids[n - 1 - k];
      games.push(r % 2 ? [b, a] : [a, b]); // alternate home/away
    }
    weeks.push(games);
    ids.splice(1, 0, ids.pop()); // rotate everyone except the first player
  }
  return weeks;
}
const WEEKS = schedule(PLAYER_COUNT);

// ---- Storage: Firebase Realtime Database when configured, otherwise this browser only ----
const store = await (async () => {
  if (firebaseConfig.databaseURL) {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      const db = getDatabase(initializeApp(firebaseConfig));
      const status = document.getElementById("status");
      onValue(ref(db, ".info/connected"), snap => {
        status.textContent = snap.val() ? "Live" : "Reconnecting…";
        status.className = snap.val() ? "live" : "local";
      });
      return {
        subscribe: cb => onValue(ref(db, "league"), snap => cb(snap.val() || {})),
        setResult: (key, val) => set(ref(db, `league/results/${key}`), val),
        setPlayers: players => set(ref(db, "league/players"), players),
        resetResults: () => set(ref(db, "league/results"), null),
      };
    } catch (err) {
      console.error("Firebase failed to load, falling back to local storage", err);
    }
  }

  const status = document.getElementById("status");
  status.textContent = "Local only – not shared";
  status.className = "local";
  let listener = () => {};
  const read = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; } };
  const write = fn => {
    const d = read(); fn(d);
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); } catch {}
    listener(d);
  };
  return {
    subscribe: cb => { listener = cb; cb(read()); },
    setResult: (key, val) => write(d => { d.results = d.results || {}; if (val) d.results[key] = val; else delete d.results[key]; }),
    setPlayers: players => write(d => { d.players = players; }),
    resetResults: () => write(d => { d.results = {}; }),
  };
})();

// ---- Standings ----
function standings() {
  const rows = state.players.map((name, i) => ({ i, name, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, form: [] }));
  WEEKS.flat().forEach(([h, a]) => {
    const res = state.results[`${h}-${a}`];
    if (!res) return;
    const [hg, ag] = res;
    const home = rows[h], away = rows[a];
    home.P++; away.P++;
    home.GF += hg; home.GA += ag; away.GF += ag; away.GA += hg;
    if (hg > ag) { home.W++; away.L++; home.form.push("W"); away.form.push("L"); }
    else if (hg < ag) { away.W++; home.L++; away.form.push("W"); home.form.push("L"); }
    else { home.D++; away.D++; home.form.push("D"); away.form.push("D"); }
  });
  rows.forEach(r => { r.GD = r.GF - r.GA; r.Pts = r.W * 3 + r.D; });
  // Premier League tiebreakers: points, goal difference, goals scored
  return rows.sort((x, y) => y.Pts - x.Pts || y.GD - x.GD || y.GF - x.GF || x.name.localeCompare(y.name));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- Rendering ----
function renderTable() {
  const rows = standings();
  const anyPlayed = rows.some(r => r.P);
  document.getElementById("table").innerHTML = `
    <tr><th>#</th><th class="name">Player</th><th>P</th><th>W</th><th>D</th><th>L</th>
        <th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>
    ${rows.map((r, idx) => `
      <tr class="${idx === 0 && anyPlayed ? "leader" : ""}">
        <td>${idx + 1}</td><td class="name">${esc(r.name)}</td>
        <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
        <td>${r.GF}</td><td>${r.GA}</td><td>${r.GD > 0 ? "+" : ""}${r.GD}</td>
        <td class="pts">${r.Pts}</td>
        <td><span class="form">${r.form.slice(-5).map(f => `<span class="${f}">${f}</span>`).join("")}</span></td>
      </tr>`).join("")}`;
}

function renderFixtures() {
  // Keep the cursor where it was if an update arrives while someone is typing
  const focused = document.activeElement?.dataset?.key ? document.activeElement : null;
  const focusId = focused && `${focused.dataset.key}:${focused.dataset.side}`;

  document.getElementById("fixtures").innerHTML = WEEKS.map((games, w) => `
    <div class="week"><h3>Matchweek ${w + 1}</h3>
      ${games.map(([h, a]) => {
        const key = `${h}-${a}`;
        const res = state.results[key] || drafts[key] || ["", ""];
        return `<div class="fixture ${state.results[key] ? "played" : ""}">
          <span class="home">${esc(state.players[h])}</span>
          <span class="score">
            <input inputmode="numeric" data-key="${key}" data-side="0" value="${res[0]}" aria-label="${esc(state.players[h])} goals">
            –
            <input inputmode="numeric" data-key="${key}" data-side="1" value="${res[1]}" aria-label="${esc(state.players[a])} goals">
          </span>
          <span class="away">${esc(state.players[a])}</span>
        </div>`;
      }).join("")}
    </div>`).join("");

  if (focusId) {
    const [key, side] = focusId.split(":");
    document.querySelector(`input[data-key="${key}"][data-side="${side}"]`)?.focus();
  }
}

function renderPlayers() {
  // Don't overwrite a name someone is in the middle of editing
  if (document.getElementById("players").contains(document.activeElement)) return;
  document.getElementById("players").innerHTML = state.players
    .map((p, i) => `<input value="${esc(p)}" data-i="${i}" maxlength="30" aria-label="Player ${i + 1} name">`).join("");
}

function render() { renderTable(); renderFixtures(); renderPlayers(); }

// ---- Events ----
// A result is saved once both scores are filled in; clearing a box removes it.
document.getElementById("fixtures").addEventListener("change", e => {
  const key = e.target.dataset.key;
  if (!key) return;
  const vals = [...document.querySelectorAll(`input[data-key="${key}"]`)].map(inp => inp.value.trim());
  if (vals.every(v => /^\d{1,2}$/.test(v))) {
    delete drafts[key];
    store.setResult(key, vals.map(Number));
  } else {
    if (vals.some(v => v !== "")) drafts[key] = vals; else delete drafts[key];
    if (state.results[key]) store.setResult(key, null);
  }
});

document.getElementById("saveNames").onclick = () => {
  const players = [...document.querySelectorAll("#players input")]
    .map((inp, i) => inp.value.trim().slice(0, 30) || DEFAULT_PLAYERS[i]);
  document.activeElement?.blur();
  store.setPlayers(players);
};

document.getElementById("reset").onclick = e => {
  // Two-click confirm so a stray tap doesn't wipe the league
  const btn = e.target;
  if (btn.dataset.armed) {
    store.resetResults();
    delete btn.dataset.armed; btn.textContent = "Reset results";
  } else {
    btn.dataset.armed = "1"; btn.textContent = "Click again to confirm";
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = "Reset results"; }, 3000);
  }
};

// ---- Start ----
store.subscribe(data => {
  const players = data.players ? Object.values(data.players) : [];
  state = {
    players: players.length === PLAYER_COUNT ? players : [...DEFAULT_PLAYERS],
    results: data.results || {},
  };
  render();
});
</script>
</body>
</html>
